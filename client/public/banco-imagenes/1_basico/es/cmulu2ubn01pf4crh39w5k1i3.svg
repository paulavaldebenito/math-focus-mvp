<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 673" role="img" aria-labelledby="title desc"><title id="title">Lee el pictograma</title><desc id="desc">Los niños del curso votan por el color de la camiseta de su equipo. Cada dibujo vale 1 voto. Rojo: 🔴🔴🔴🔴. Azul: 🔵🔵🔵🔵🔵🔵🔵. Verde: 🟢🟢. Dos niños más votan por el verde. ¿Qué color queda con más votos?</desc><rect x="0" y="0" width="640" height="673" rx="26" fill="#F7FAFD" stroke="none" stroke-width="2"/><rect x="20" y="20" width="600" height="64" rx="22" fill="#EAF1FA" stroke="none" stroke-width="2"/><text x="320" y="61" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Lee el pictograma</text><rect x="28" y="99" width="584" height="80" rx="20" fill="#FFF4D8" stroke="none" stroke-width="2"/><text x="52" y="148" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Cada dibujo = 1 unidad</text><rect x="28" y="188" width="584" height="123" rx="20" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="52" y="223" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Rojo</text><g transform="translate(52,240) scale(1.1666666666666667)" opacity="1"><circle cx="18" cy="18" r="14" fill="#E57F87" stroke="#263E59" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="3" ry="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/></g><g transform="translate(104,240) scale(1.1666666666666667)" opacity="1"><circle cx="18" cy="18" r="14" fill="#E57F87" stroke="#263E59" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="3" ry="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/></g><g transform="translate(156,240) scale(1.1666666666666667)" opacity="1"><ci