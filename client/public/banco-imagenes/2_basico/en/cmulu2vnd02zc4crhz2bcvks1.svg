<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 397" role="img" aria-labelledby="title desc"><title id="title">Read the pictograph</title><desc id="desc">In a pictograph, each egg picture stands for 5 eggs collected. There are 3 pictures in Friday&#x27;s row. How many eggs were collected on Friday?</desc><rect x="0" y="0" width="640" height="397" rx="26" fill="#F7FAFD" stroke="none" stroke-width="2"/><rect x="20" y="20" width="600" height="64" rx="22" fill="#EAF1FA" stroke="none" stroke-width="2"/><text x="320" y="61" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Read the pictograph</text><rect x="28" y="99" width="584" height="80" rx="20" fill="#FFF4D8" stroke="none" stroke-width="2"/><text x="52" y="148" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Key: each picture = 5</text><rect x="28" y="188" width="584" height="123" rx="20" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="52" y="223" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Friday</text><g transform="translate(52,240) scale(1.1666666666666667)" opacity="1"><path d="M18 3 C9 3 2 22 6 30 C10 38 30 36 31 27 C32 18 25 3 18 3 Z" fill="#FFF2D5" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="16" rx="2" ry="5" fill="#FFFFFF" stroke="none" stroke-width="1.5"/></g><g transform="translate(104,240) scale(1.1666666666666667)" opacity="1"><path d="M18 3 C9 3 2 22 6 30 C10 38 30 36 31 27 C32 18 25 3 18 3 Z" fill="#FFF2D5" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="16" rx="2" ry="5" fill="#FFFFFF" stroke="none" stroke-width="1.5"/></g><g transform="translate(156,240) scale(1.1666666666666667)" opacity="1"><path d="M18 3 C9 3 2 22 6 30 C10 38 30 36 31 27 C32 18 25 3 18 3 Z" fill="#FFF2D5" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="12" cy="16" rx="2" ry="5" fill="#FFFFFF" stroke="none" stroke-width="1.5"/></g></svg>