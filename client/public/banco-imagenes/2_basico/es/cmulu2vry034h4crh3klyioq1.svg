<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 397" role="img" aria-labelledby="title desc"><title id="title">Lee el pictograma</title><desc id="desc">En un pictograma, cada cupcake dibujado vale 5 cupcakes vendidos. Hay 3 dibujos en la fila del viernes. ¿Cuántos cupcakes se vendieron el viernes?</desc><rect x="0" y="0" width="640" height="397" rx="26" fill="#F7FAFD" stroke="none" stroke-width="2"/><rect x="20" y="20" width="600" height="64" rx="22" fill="#EAF1FA" stroke="none" stroke-width="2"/><text x="320" y="61" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Lee el pictograma</text><rect x="28" y="99" width="584" height="80" rx="20" fill="#FFF4D8" stroke="none" stroke-width="2"/><text x="52" y="148" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Cada dibujo = 5 unidades</text><rect x="28" y="188" width="584" height="123" rx="20" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="52" y="223" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Viernes</text><g transform="translate(52,240) scale(1.1666666666666667)" opacity="1"><path d="M7 19 L29 19 L26 34 L10 34 Z" fill="#5478DD" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19 Q1 12 9 10 Q9 3 17 6 Q22 0 27 8 Q36 9 31 19 Z" fill="#F2B5C5" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 24 L15 31 M22 24 L21 31" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19" cy="5" r="3" fill="#E57779" stroke="none" stroke-width="1.5"/></g><g transform="translate(104,2