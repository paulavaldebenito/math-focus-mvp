<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 397" role="img" aria-labelledby="title desc"><title id="title">Lee el pictograma</title><desc id="desc">En un pictograma, cada estrella vale 2 niños. La fila de los que van al taller de natación tiene 4 estrellas. ¿Cuántos niños van al taller de natación?</desc><rect x="0" y="0" width="640" height="397" rx="26" fill="#F7FAFD" stroke="none" stroke-width="2"/><rect x="20" y="20" width="600" height="64" rx="22" fill="#EAF1FA" stroke="none" stroke-width="2"/><text x="320" y="61" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Lee el pictograma</text><rect x="28" y="99" width="584" height="80" rx="20" fill="#FFF4D8" stroke="none" stroke-width="2"/><text x="52" y="148" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Cada dibujo = 2 unidades</text><rect x="28" y="188" width="584" height="123" rx="20" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="52" y="223" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Fila 1</text><g transform="translate(52,240) scale(1.1666666666666667)" opacity="1"><path d="M18 2 L23 12 L34 14 L26 22 L28 33 L18 28 L8 33 L10 22 L2 14 L13 12 Z" fill="#F4CD62" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(104,240) scale(1.1666666666666667)" opacity="1"><path d="M18 2 L23 12 L34 14 L26 22 L28 33 L18 28 L8 33 L10 22 L2 14 L13 12 Z" fill="#F4CD62" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(156,240) scale(1.1666666666666667)" opacity="1"><path d="M18 2 L23 12 L34 14 L26 22 L28 33 L18 28 L8 33 L10 22 L2 14 L13 12 Z" fill="#F4CD62" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(208,240) scale(1.1666666666666667)" opacity="1"><path d="M18 2 L23 12 L34 14 L26 22 L28 33 L18 28 L8 33 L10 22 L2 14 L13 12 Z" fill="#F4CD62" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>