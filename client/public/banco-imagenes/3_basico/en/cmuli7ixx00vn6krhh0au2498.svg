<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 397" role="img" aria-labelledby="title desc"><title id="title">Read the pictograph</title><desc id="desc">In a pictograph, each book picture stands for 2 books. In the “Monday” row there are 4 book pictures. How many books does that represent?</desc><rect x="0" y="0" width="640" height="397" rx="26" fill="#F7FAFD" stroke="none" stroke-width="2"/><rect x="20" y="20" width="600" height="64" rx="22" fill="#EAF1FA" stroke="none" stroke-width="2"/><text x="320" y="61" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Read the pictograph</text><rect x="28" y="99" width="584" height="80" rx="20" fill="#FFF4D8" stroke="none" stroke-width="2"/><text x="52" y="148" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Key: each picture = 2</text><rect x="28" y="188" width="584" height="123" rx="20" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="52" y="223" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Monday</text><g transform="translate(52,240) scale(1.1666666666666667)" opacity="1"><path d="M3 6 Q11 3 18 8 Q26 3 33 6 L33 30 Q26 28 18 33 Q10 28 3 30 Z" fill="#5478DD" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 8 L18 33 M7 12 L13 13 M23 12 L29 11 M7 18 L13 19 M23 18 L29 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(104,240) scale(1.1666666666666667)" opacity="1"><path d="M3 6 Q11 3 18 8 Q26 3 33 6 L33 30 Q26 28 18 33 Q10 28 3 30 Z" fill="#5478DD" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 8 L18 33 M7 12 L13 13 M23 12 L29 11 M7 18 L13 19 M23 18 L29 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(156,240) scale(1.1666666666666667)" opacity="1"><path d="M3 6 Q11 3 18 8 Q26 3 33 6 L33 30 Q26 28 18 33 Q10 28 3 30 Z" fill="#5478DD" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 8 L18 33 M7 12 L13 13 M23 12 L29 11 M7 18 L13 19 M23 18 L29 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(208,240) scale(1.1666666666666667)" opacity="1"><path d="M3 6 Q11 3 18 8 Q26 3 33 6 L33 30 Q26 28 18 33 Q10 28 3 30 Z" fill="#5478DD" stroke="#263E59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 8 L18 33 M7 12 L13 13 M23 12 L29 11 M7 18 L13 19 M23 18 L29 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>