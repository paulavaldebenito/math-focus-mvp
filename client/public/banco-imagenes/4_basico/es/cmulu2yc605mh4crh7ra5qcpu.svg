<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 535" role="img" aria-labelledby="title desc"><title id="title">Lee el pictograma</title><desc id="desc">En un pictograma cada símbolo vale 6 monedas ganadas. El lunes hay 3 símbolos y el martes 5. ¿Cuántas monedas se ganaron entre los dos días?</desc><rect x="0" y="0" width="640" height="535" rx="26" fill="#F7FAFD" stroke="none" stroke-width="2"/><rect x="20" y="20" width="600" height="64" rx="22" fill="#EAF1FA" stroke="none" stroke-width="2"/><text x="320" y="61" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Lee el pictograma</text><rect x="28" y="99" width="584" height="80" rx="20" fill="#FFF4D8" stroke="none" stroke-width="2"/><text x="52" y="148" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Cada dibujo = 6 unidades</text><rect x="28" y="188" width="584" height="123" rx="20" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="52" y="223" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">Lunes</text><g transform="translate(52,240) scale(1.1666666666666667)" opacity="1"><circle cx="18" cy="18" r="15" fill="#F5D274" stroke="#AC8750" stroke-width="1.5"/><circle cx="18" cy="18" r="11" fill="none" stroke="#CFAB58" stroke-width="1.5"/><path d="M18 9 L21 15 L27 16 L22 20 L23 26 L18 23 L13 26 L14 20 L9 16 L15 15 Z" fill="#C49A46" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(104,240) scale(1.1666666666666667)" opacity="1"><circle cx="18" cy="18" r="15" fill="#F5D274" stroke="#AC8750" stroke-width="1.5"/><circle cx="18" cy="18" r="11" fill="none" stroke="#