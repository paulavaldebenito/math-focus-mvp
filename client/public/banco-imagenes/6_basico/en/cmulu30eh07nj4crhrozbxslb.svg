<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 626" role="img" aria-labelledby="title desc"><title id="title">Pie chart</title><desc id="desc">In a pie chart of 100 people: pizza is 45%, empanadas is 30% and cakes is the rest. What percentage chooses cakes?</desc><rect x="0" y="0" width="640" height="626" rx="26" fill="#F7FAFD" stroke="none" stroke-width="2"/><rect x="20" y="20" width="600" height="64" rx="22" fill="#EAF1FA" stroke="none" stroke-width="2"/><text x="320" y="61" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle">Pie chart</text><path d="M320 260 L320.0 110.0 A150 150 0 0 1 366.3525491562421 402.658477444273 Z" fill="#5478DD" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="416.7934573783235" y="252.66942242605737" fill="#FFFFFF" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">1</text><path d="M320 260 L366.3525491562421 402.658477444273 A150 150 0 0 1 170.0 260.0 Z" fill="#F1A257" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="262.39704527533763" y="347.28366544874484" fill="#FFFFFF" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">2</text><path d="M320 260 L170.0 260.0 A150 150 0 0 1 320.0 110.0 Z" fill="#61B899" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="250.70353544371832" y="198.70353544371835" fill="#FFFFFF" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">3</text><rect x="40" y="436" width="25" height="25" rx="6" fill="#5478DD" stroke="none" stroke-width="2"/><text x="82" y="455" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">1. Pizza · 45%</text><rect x="40" y="481" width="25" height="25" rx="6" fill="#F1A257" stroke="none" stroke-width="2"/><text x="82" y="500" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">2. Empanadas · 30%</text><rect x="40" y="526" width="25" height="25" rx="6" fill="#61B899" stroke="none" stroke-width="2"/><text x="82" y="545" fill="#263E59" font-family="Comic Sans MS, Comic Sans, Chalkboard SE, Comic Neue, DejaVu Sans, Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">3. The rest · ?</text></svg>